<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Products</title>
    </head>
    <body>
        <h1>Products Page</h1>

        <!-- Form for sending POST request -->
        <h2>POST Product Information</h2>
        <form id="postForm">
            <label for="productName">Product Name:</label>
            <input
                type="text"
                id="productName"
                name="productName"
                required
            /><br /><br />

            <label for="productPrice">Product Price:</label>
            <input
                type="number"
                id="productPrice"
                name="productPrice"
                required
            /><br /><br />

            <button type="submit">Submit Product</button>
        </form>

        <br /><br />

        <!-- Button for triggering GET request -->
        <h2>Get Product Information</h2>
        <button id="getProductsBtn">Get Products</button>

        <h3>Product List:</h3>
        <ul id="productList"></ul>

        <script src="products.js"></script>
    </body>
</html>
